[project]
name = "website"
version = "0.0.dev0"
description = ""
authors = [{name = "Your Name", email = "user@example.com"}]
requires-python = ">=3.14"
dependencies = [
    "Flask>=2.0.1,<3",
    "waitress>=2.0.0,<3",
]

[dependency-groups]
dev = [
    "black>=20.8b1",
    "isort>=5.7.0",
    "mypy>=0.812",
    "types-waitress>=3.0.0",
    "pyenchant>=3.2.0",
    "pylint>=2.7.0",
    "pytest-cov>=2.11.1",
    "pytest-xdist>=2.2.1",
    "shellcheck-py>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/website"]
