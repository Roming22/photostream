apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photostream-photos
  namespace: photostream
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Remove storageClassName to use the cluster default storage class,
  # or set it explicitly (e.g. "local-path" for k3s, "standard" for GKE, etc.)
  # storageClassName: local-path
