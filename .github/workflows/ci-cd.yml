name: CI/CD

on:
  push:
    branches:
      - dev
      - release/*
  pull_request:
    branches:
      - dev
      - release/*

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install environment
        run: |
          date
          make environment
      - name: Run tests
        run: |
          date
          make test
          date
  CD:
    needs: CI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and upload image
        env:
          IMAGE_REPOSITORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY_URL: ghcr.io
          IMAGE_REPOSITORY_USER: ${{ github.repository_owner }}
        run: |
          date
          make upload
          date
